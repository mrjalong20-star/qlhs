name: Migrate class grade 6-12

on:
  push:
    paths:
      - '.github/workflows/migrate-grade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch class grade support
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing patch anchor: {label}')
              return text.replace(old, new, 1)

          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          if 'grade INTEGER NOT NULL DEFAULT 6' not in s:
              s = replace_once(s, "      school_year TEXT NOT NULL DEFAULT '',\n      teacher_username TEXT NOT NULL,", "      school_year TEXT NOT NULL DEFAULT '',\n      grade INTEGER NOT NULL DEFAULT 6,\n      teacher_username TEXT NOT NULL,", 'class table grade column')
          if 'ALTER TABLE app_classes ADD COLUMN IF NOT EXISTS grade' not in s:
              s = replace_once(s, "    CREATE INDEX IF NOT EXISTS app_presence_last_seen_idx ON app_presence (last_seen_ms);\n  `);", "    CREATE INDEX IF NOT EXISTS app_presence_last_seen_idx ON app_presence (last_seen_ms);\n    ALTER TABLE app_classes ADD COLUMN IF NOT EXISTS grade INTEGER NOT NULL DEFAULT 6;\n  `);", 'class grade migration')
          if 'const grade = Number(req.body?.grade || 6)' not in s:
              s = replace_once(s, '      const cleanName = String(req.body?.name || "").trim();\n      if (!cleanName) return res.status(400).json({ success: false, message: "Vui lòng nhập tên lớp." });', '      const cleanName = String(req.body?.name || "").trim();\n      const grade = Number(req.body?.grade || 6);\n      if (!cleanName) return res.status(400).json({ success: false, message: "Vui lòng nhập tên lớp." });\n      if (!Number.isInteger(grade) || grade < 6 || grade > 12) return res.status(400).json({ success: false, message: "Khối phải từ 6 đến 12." });', 'class POST grade validation')
          if 'school_year,grade,teacher_username' not in s:
              s = replace_once(s, '      const record = { id, name: cleanName, classCode, schoolYear, teacherUsername: auth.username, teacherName: auth.displayName, createdAt: new Date().toISOString(), students: [] as any[] };\n      if (memoryFallback()) memory.classes.set(id, record);\n      else await query("INSERT INTO app_classes(id,name,class_code,school_year,teacher_username,teacher_name,students) VALUES($1,$2,$3,$4,$5,$6,$7::jsonb)", [id,cleanName,classCode,schoolYear,auth.username,auth.displayName,"[]"]);', '      const record = { id, name: cleanName, classCode, schoolYear, grade, teacherUsername: auth.username, teacherName: auth.displayName, createdAt: new Date().toISOString(), students: [] as any[] };\n      if (memoryFallback()) memory.classes.set(id, record);\n      else await query("INSERT INTO app_classes(id,name,class_code,school_year,grade,teacher_username,teacher_name,students) VALUES($1,$2,$3,$4,$5,$6,$7,$8::jsonb)", [id,cleanName,classCode,schoolYear,grade,auth.username,auth.displayName,"[]"]);', 'class POST persistence')
          s = s.replace('school_year AS "schoolYear",teacher_username AS "teacherUsername"', 'school_year AS "schoolYear",grade,teacher_username AS "teacherUsername"')
          s = s.replace('schoolYear: record.schoolYear, teacherName: record.teacherName }', 'schoolYear: record.schoolYear, grade: Number(record.grade || 6), teacherName: record.teacherName }')
          s = s.replace('profile: { studentName: student.studentName, className: record.name, dateOfBirth: student.dateOfBirth }, classId: record.id, teacherName: record.teacherName', 'profile: { studentName: student.studentName, className: record.name, dateOfBirth: student.dateOfBirth, grade: Number(record.grade || 6) }, classId: record.id, teacherName: record.teacherName, grade: Number(record.grade || 6)')
          p.write_text(s, encoding='utf-8')

          p = Path('src/components/admin/ClassManager.tsx')
          s = p.read_text(encoding='utf-8')
          if 'grade: 6 | 7 | 8 | 9 | 10 | 11 | 12;' not in s:
              s = s.replace('  studentCount: number;\n}', '  studentCount: number;\n  grade: 6 | 7 | 8 | 9 | 10 | 11 | 12;\n}', 1)
              s = s.replace('  const [name, setName] = useState("");\n', '  const [name, setName] = useState("");\n  const [grade, setGrade] = useState<SchoolClass[\'grade\']>(6);\n', 1)
              s = s.replace('body: JSON.stringify({ name: cleanName }),', 'body: JSON.stringify({ name: cleanName, grade }),', 1)
              s = s.replace('      setName("");\n\n      const url', '      setName("");\n      setGrade(6);\n\n      const url', 1)
              s = s.replace('      <div className="flex flex-col sm:flex-row gap-2">\n        <input', '      <div className="flex flex-col sm:flex-row gap-2">\n        <select value={grade} onChange={(e) => setGrade(Number(e.target.value) as SchoolClass[\'grade\'])} disabled={loading} className="px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold sm:w-32">{[6,7,8,9,10,11,12].map((g) => <option key={g} value={g}>Khối {g}</option>)}</select>\n        <input', 1)
              s = s.replace('{c.studentCount || 0} học sinh • Mã lớp {c.classCode}', 'Khối {c.grade} • {c.studentCount || 0} học sinh • Mã lớp {c.classCode}', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/types/index.ts')
          s = p.read_text(encoding='utf-8')
          if 'grade?: 6 | 7 | 8 | 9 | 10 | 11 | 12;' not in s:
              s = s.replace('  teacherName?: string;\n}', '  teacherName?: string;\n  grade?: 6 | 7 | 8 | 9 | 10 | 11 | 12;\n}', 1)
          p.write_text(s, encoding='utf-8')
          print('grade migration patch complete')
          PY
      - name: Validate production build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/components/admin/ClassManager.tsx src/types/index.ts
          git diff --cached --quiet || git commit -m 'feat: add class grade 6-12 support'
          git push
