name: Migrate class grade 6-12

on:
  push:
    paths:
      - '.github/workflows/migrate-grade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch class grade support
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing patch anchor: {label}')
              text2 = text.replace(old, new, 1)
              if text2 == text:
                  raise SystemExit(f'Patch did not change: {label}')
              return text2

          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "      school_year TEXT NOT NULL DEFAULT '',\n      teacher_username TEXT NOT NULL,",
              "      school_year TEXT NOT NULL DEFAULT '',\n      grade INTEGER NOT NULL DEFAULT 6,\n      teacher_username TEXT NOT NULL,",
              'class table grade column')
          s = replace_once(s,
              "    CREATE INDEX IF NOT EXISTS app_presence_last_seen_idx ON app_presence (last_seen_ms);\n  `);",
              "    CREATE INDEX IF NOT EXISTS app_presence_last_seen_idx ON app_presence (last_seen_ms);\n    ALTER TABLE app_classes ADD COLUMN IF NOT EXISTS grade INTEGER NOT NULL DEFAULT 6;\n  `);",
              'class grade migration')
          s = replace_once(s,
              "      const cleanName = String(req.body?.name || \"\").trim();\n      if (!cleanName) return res.status(400).json({ success: false, message: \"Vui lòng nhập tên lớp.\" });",
              "      const cleanName = String(req.body?.name || \"\").trim();\n      const grade = Number(req.body?.grade || 6);\n      if (!cleanName) return res.status(400).json({ success: false, message: \"Vui lòng nhập tên lớp.\" });\n      if (!Number.isInteger(grade) || grade < 6 || grade > 12) return res.status(400).json({ success: false, message: \"Khối phải từ 6 đến 12.\" });",
              'class POST grade validation')
          s = replace_once(s,
              "      const record = { id, name: cleanName, classCode, schoolYear, teacherUsername: auth.username, teacherName: auth.displayName, createdAt: new Date().toISOString(), students: [] as any[] };\n      if (memoryFallback()) memory.classes.set(id, record);\n      else await query(\"INSERT INTO app_classes(id,name,class_code,school_year,teacher_username,teacher_name,students) VALUES($1,$2,$3,$4,$5,$6,$7::jsonb)\", [id,cleanName,classCode,schoolYear,auth.username,auth.displayName,\"[]\"]);",
              "      const record = { id, name: cleanName, classCode, schoolYear, grade, teacherUsername: auth.username, teacherName: auth.displayName, createdAt: new Date().toISOString(), students: [] as any[] };\n      if (memoryFallback()) memory.classes.set(id, record);\n      else await query(\"INSERT INTO app_classes(id,name,class_code,school_year,grade,teacher_username,teacher_name,students) VALUES($1,$2,$3,$4,$5,$6,$7,$8::jsonb)\", [id,cleanName,classCode,schoolYear,grade,auth.username,auth.displayName,\"[]\"]);",
              'class POST persistence')
          s = replace_once(s,
              "      const r = await query<any>(\"SELECT id,name,class_code AS \\\"classCode\\\",school_year AS \\\"schoolYear\\\",teacher_username AS \\\"teacherUsername\\\",teacher_name AS \\\"teacherName\\\",created_at AS \\\"createdAt\\\", jsonb_array_length(students) AS \\\"studentCount\\\" FROM app_classes WHERE teacher_username=$1 ORDER BY created_at DESC\", [auth.username]);",
              "      const r = await query<any>(\"SELECT id,name,class_code AS \\\"classCode\\\",school_year AS \\\"schoolYear\\\",grade,teacher_username AS \\\"teacherUsername\\\",teacher_name AS \\\"teacherName\\\",created_at AS \\\"createdAt\\\", jsonb_array_length(students) AS \\\"studentCount\\\" FROM app_classes WHERE teacher_username=$1 ORDER BY created_at DESC\", [auth.username]);",
              'class list grade')
          s = replace_once(s,
              "    const r = await query<any>(\"SELECT id,name,class_code AS \\\"classCode\\\",school_year AS \\\"schoolYear\\\",teacher_username AS \\\"teacherUsername\\\",teacher_name AS \\\"teacherName\\\",students,created_at AS \\\"createdAt\\\" FROM app_classes WHERE id=$1\", [id]);",
              "    const r = await query<any>(\"SELECT id,name,class_code AS \\\"classCode\\\",school_year AS \\\"schoolYear\\\",grade,teacher_username AS \\\"teacherUsername\\\",teacher_name AS \\\"teacherName\\\",students,created_at AS \\\"createdAt\\\" FROM app_classes WHERE id=$1\", [id]);",
              'getClass grade')
          s = replace_once(s,
              "      res.json({ success: true, data: { id: record.id, name: record.name, classCode: record.classCode, schoolYear: record.schoolYear, teacherName: record.teacherName } });",
              "      res.json({ success: true, data: { id: record.id, name: record.name, classCode: record.classCode, schoolYear: record.schoolYear, grade: Number(record.grade || 6), teacherName: record.teacherName } });",
              'public class meta grade')
          s = replace_once(s,
              "      res.json({ success: true, sessionId, profile: { studentName: student.studentName, className: record.name, dateOfBirth: student.dateOfBirth }, classId: record.id, teacherName: record.teacherName });",
              "      res.json({ success: true, sessionId, profile: { studentName: student.studentName, className: record.name, dateOfBirth: student.dateOfBirth, grade: Number(record.grade || 6) }, classId: record.id, teacherName: record.teacherName, grade: Number(record.grade || 6) });",
              'student login grade')
          p.write_text(s, encoding='utf-8')

          p = Path('src/components/admin/ClassManager.tsx')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, "  studentCount: number;\n}", "  studentCount: number;\n  grade: 6 | 7 | 8 | 9 | 10 | 11 | 12;\n}", 'class interface grade')
          s = replace_once(s, "  const [name, setName] = useState(\"\");\n", "  const [name, setName] = useState(\"\");\n  const [grade, setGrade] = useState<SchoolClass['grade']>(6);\n", 'class grade state')
          s = replace_once(s, "        body: JSON.stringify({ name: cleanName }),", "        body: JSON.stringify({ name: cleanName, grade }),", 'class POST body grade')
          s = replace_once(s, "      setName(\"\");\n\n      const url", "      setName(\"\");\n      setGrade(6);\n\n      const url", 'class reset grade')
          s = replace_once(s, "      <div className=\"flex flex-col sm:flex-row gap-2\">\n        <input", "      <div className=\"flex flex-col sm:flex-row gap-2\">\n        <select value={grade} onChange={(e) => setGrade(Number(e.target.value) as SchoolClass['grade'])} disabled={loading} className=\"px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm font-semibold sm:w-32\">\n          {[6,7,8,9,10,11,12].map((g) => <option key={g} value={g}>Khối {g}</option>)}\n        </select>\n        <input", 'class grade selector')
          s = replace_once(s, "                <div className=\"font-bold text-slate-900\">Lớp {c.name}</div>\n                <div className=\"text-[11px] text-slate-500 mt-1\">{c.studentCount || 0} học sinh • Mã lớp {c.classCode}</div>", "                <div className=\"font-bold text-slate-900\">Lớp {c.name}</div>\n                <div className=\"text-[11px] text-slate-500 mt-1\">Khối {c.grade} • {c.studentCount || 0} học sinh • Mã lớp {c.classCode}</div>", 'class list grade display')
          p.write_text(s, encoding='utf-8')

          p = Path('src/types/index.ts')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, "  teacherName?: string;\n}", "  teacherName?: string;\n  grade?: 6 | 7 | 8 | 9 | 10 | 11 | 12;\n}", 'student profile grade')
          p.write_text(s, encoding='utf-8')
          print('grade migration patch complete')
          PY

      - name: Validate
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run lint

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts src/components/admin/ClassManager.tsx src/types/index.ts
          git diff --cached --quiet || git commit -m 'feat: add class grade 6-12 support'
          git push
